info:
  name: update registration status
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{BASE_URL}}registrations/{{registrationId}}/status"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{ "status": "confirmed" }'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
