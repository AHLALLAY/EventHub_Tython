info:
  name: get registrations by event
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}registrations?eventId={{eventId}}"
  params:
    - name: eventId
      value: "{{eventId}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
