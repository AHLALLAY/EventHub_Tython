info:
  name: add registration
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}registrations"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "eventId": "{{eventId}}",
        "participantId": "{{participantId}}",
        "status": "pending"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body && res.body.id) {
          bru.setEnvVar("registrationId", res.body.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
