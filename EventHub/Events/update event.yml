info:
  name: update event
  type: http
  seq: 5

http:
  method: PUT
  url: "{{BASE_URL}}/events/{{eventId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "Titre modifié",
        "maxParticipants": 80
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
